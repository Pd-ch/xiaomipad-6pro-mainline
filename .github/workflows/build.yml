name: Kernel build
on:
  push:
    paths:
      - 'kernel/source.json'
      - 'device/configs/**'
      - 'tools/build-liuqin-kernel*'
      - '.github/actions/kernel/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'kernel/source.json'
      - 'device/configs/**'
      - 'tools/build-liuqin-kernel*'
      - '.github/actions/kernel/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: ./project/.github/actions/kernel
        with:
          kernel-repository: ${{ github.repository_owner }}/linux-sm8450-liuqin
