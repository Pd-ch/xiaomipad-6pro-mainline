name: Kernel build

on:
  push:
    paths:
      - 'kernel/source.json'
      - 'device/configs/**'
      - 'tools/build-liuqin-kernel.py'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'kernel/source.json'
      - 'device/configs/**'
      - 'tools/build-liuqin-kernel.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - name: Read kernel revision
        id: kernel
        run: |
          python3 - <<'PY'
          import json, os, re
          lock = json.load(open('project/kernel/source.json'))
          assert re.fullmatch(r'[0-9a-f]{40}', lock['commit'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('commit=' + lock['commit'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/linux-sm8450-liuqin
          ref: ${{ steps.kernel.outputs.commit }}
          path: linux-sm8450-liuqin
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu python3 ccache kmod rsync
      - name: Build kernel
        run: python3 project/tools/build-liuqin-kernel.py --jobs 4
      - name: Package modules
        run: |
          tar -C project/out/kernel/modules --exclude=build --exclude=source \
            -czf project/out/kernel/modules.tar.gz lib/modules
          cd project/out/kernel
          sha256sum modules.tar.gz >> SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: liuqin-kernel
          if-no-files-found: error
          include-hidden-files: true
          path: |
            project/out/kernel/arch/arm64/boot/Image
            project/out/kernel/arch/arm64/boot/dts/qcom/sm8475-xiaomi-liuqin.dtb
            project/out/kernel/modules.tar.gz
            project/out/kernel/SHA256SUMS
            project/out/kernel/build-info.json
            project/out/kernel/.config
            project/out/kernel/vmlinux
            project/out/kernel/System.map
          retention-days: 14
