[Unit]
# Never publish a sensor proxy merely because SLPI/QRTR nodes exist.  The gate
# succeeds only after ssccli receives a real accelerometer measurement.
Requires=liuqin-ssc-sample-gate.service
After=liuqin-ssc-sample-gate.service

[Service]
# libssc talks QMI over QRTR.  Keep upstream lockdown but admit that family.
ExecStart=
ExecStart=/usr/local/libexec/liuqin-iio-sensor-proxy
RestrictAddressFamilies=AF_UNIX AF_LOCAL AF_NETLINK AF_QIPCRTR
