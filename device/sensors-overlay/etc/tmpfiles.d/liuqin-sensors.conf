# Device-unique SSC registry/calibration is runtime state.  It is deliberately
# outside /usr and outside the release tar's regular-file manifest.
d /var/lib/liuqin-sensors          0750 fastrpc fastrpc -
d /var/lib/liuqin-sensors/registry 0750 fastrpc fastrpc -
d /run/liuqin-sensors              0755 root    root    -
